<html>
<head>
	<!-- Fluig -->
	<link type="text/css" rel="stylesheet" href="http://fluig.castilho.com.br:1010/style-guide/css/fluig-style-guide.min.css"/>
	<script type="text/javascript" src="http://fluig.castilho.com.br:1010/portal/resources/js/jquery/jquery.js"></script>
	<script type="text/javascript" src="http://fluig.castilho.com.br:1010/portal/resources/js/jquery/jquery-ui.min.js"></script>
	<script type="text/javascript" src="http://fluig.castilho.com.br:1010/portal/resources/js/mustache/mustache-min.js"></script>
	<script type="text/javascript" src="http://fluig.castilho.com.br:1010/style-guide/js/fluig-style-guide.min.js" charset="utf-8"></script>

	<!-- Formulário -->
	<link rel="stylesheet" href="css/header.css">
	<link rel="stylesheet" href="css/footer.css">
	<link rel="stylesheet" href="css/paginacao.css">
	<script src="js/functions.js"></script>
	<script src="js/script.js"></script>
</head>
<body>
<div class="fluig-style-guide">
<form name="form" role="form">
	<div style="display: none;">


	</div>


	<header>
		<div class="wizard-progress">
			<div class="step active" data-html="true" data-toggle="popover" title=""
				data-content="<h1>Jurídico</h1> <p>O Jurídico é responsável por Validar e Editar o Contrato. Lorem ipsum dolor sit amet consectetur adipisicing elit. Corrupti error hic dolore expedita soluta provident, magni eveniet at id unde pariatur sed optio fuga reprehenderit blanditiis debitis possimus nesciunt molestiae.</p>"
				data-original-title="Popover title">
				Solicitante
			</div>
			<div class="step" data-html="true" data-toggle="popover" title=""
				data-content="<h1>Jurídico</h1> <p>O Jurídico é responsável por Validar e Editar o Contrato. Lorem ipsum dolor sit amet consectetur adipisicing elit. Corrupti error hic dolore expedita soluta provident, magni eveniet at id unde pariatur sed optio fuga reprehenderit blanditiis debitis possimus nesciunt molestiae.</p>"
				data-original-title="Popover title">
				Central de Equipamentos<br>
				QSST
			</div>
			<div class="step" data-toggle="tooltip" title="" data-html="true"
				data-content="<h1>Jurídico</h1> <p>O Jurídico é responsável por Validar e Editar o Contrato. Lorem ipsum dolor sit amet consectetur adipisicing elit. Corrupti error hic dolore expedita soluta provident, magni eveniet at id unde pariatur sed optio fuga reprehenderit blanditiis debitis possimus nesciunt molestiae.</p>"
				data-original-title="Popover title">
				Fim
			</div>
		</div>
	</header>
	<main>
		<div class="pagina" data-index="0" id="paginaIdentificacao">
			<div class="row">
				<div class="col-md-6">
					<label for="">Coliga/Empresa:</label>
					<select name="" id="" class="form-control"></select>
				</div>
				<div class="col-md-6">
					<label for="">Obra:</label>
					<select name="" id="" class="form-control"></select>
				</div>
			</div>
			<br>
			<div class="row">
				<div class="col-md-6">
					<label for="">Descrição do Equipamento:</label>
					<select name="" id="" class="form-control"></select>
				</div>
				<div class="col-md-6">
					<label for="">Prefixo:</label>
					<select name="" id="" class="form-control"></select>
				</div>
			</div>
		</div>
		<div class="pagina ativa" data-index="1" id="paginaDetalhes">
			<div class="row">
				<div class="col-md-12">
					<label for="">Categoria:</label>
					<select name="" id="" class="form-control">
						<option value=""></option>
						<option value="PA">PA</option>
						<option value="MA">MA</option>
						<option value="Outros">Outros</option>
					</select>
				</div>
			</div>
			<br>
			<div class="row">
				<div class="col-md-6">
					<label for="">Modelo:</label>
					<select name="" id="" class="form-control"></select>
				</div>
				<div class="col-md-6">
					<label for="">Fabricante:</label>
					<select name="" id="" class="form-control"></select>
				</div>
			</div>
			<br>
			<div class="row">
				<div class="col-md-6">
					<label for="">Classe Mecânica:</label>
					<select name="" id="" class="form-control"></select>
				</div>
				<div class="col-md-6">
					<label for="">Classe Operacional:</label>
					<select name="" id="" class="form-control"></select>
				</div>
			</div>
			<br>
			<div class="row">
				<div class="col-md-6">
					<label for="">Ano Fabricação:</label>
					<input type="text" name="" id="" class="form-control">
				</div>
				<div class="col-md-6">
					<label for="">Ano Modelo:</label>
					<input type="text" name="" id="" class="form-control">
				</div>
			</div>
			<br>
			<div class="row">
				<div class="col-md-6">
					<label for="">Placa:</label>
					<input type="text" name="" id="" class="form-control">
				</div>
				<div class="col-md-6">
					<label for="">Chassis:</label>
					<input type="text" name="" id="" class="form-control">
				</div>
			</div>
			<br>
			<div class="row">
				<div class="col-md-4">
					<label for="">Potência do Motor:</label>
					<div>
						<input type="text" name="" id="" class="form-control">
						<select name="" id="" class="form-control">
							<option value="CV">CV</option>
							<option value="HP">HP</option>
						</select>
					</div>
				</div>
				<div class="col-md-4">

				</div>
				<div class="col-md-4"></div>
			</div>
			<br>
			<div class="row">
				<div class="col-md-4">
					<label for="">Valor Mobilização (R$):</label>
					<div>
						<input type="text" name="" id="" class="form-control">
						<select name="" id="" class="form-control">
							<option value="hora">Hora</option>
                        	<option value="diaria">Diária</option>
                        	<option value="mensal">Mensal</option>
                        	<option value="anual">Anual</option>
                        	<option value="m3_km">M³x Km</option>
                        	<option value="ton_km">Ton x KM</option>
						</select>
					</div>
				</div>
				<div class="col-md-4">
					<label for="">Valor Extra (R$):</label>
					<div>
						<input type="text" name="" id="" class="form-control">
						<select name="" id="" class="form-control">
							<option value="hora">Hora</option>
                        	<option value="diaria">Diária</option>
                        	<option value="mensal">Mensal</option>
                        	<option value="anual">Anual</option>
                        	<option value="m3_km">M³x Km</option>
                        	<option value="ton_km">Ton x KM</option>
						</select>
					</div>
				</div>
				<div class="col-md-4">
					<label for="">Valor de Locação (R$):</label>
					<input type="text" name="" id="" class="form-control">
				</div>
			</div>
			<br>
			<div class="row">
				<div class="col-md-4">
					<label for="">Mão de Obra:</label>
					<div>
						<input type="checkbox" name="" id="">
						<label for="">Incluir Mão de Obra?</label>
					</div>
					<div>
						<label for="">Valor de Mão de Obra (R$):</label>
						<input type="text" name="" id="" class="form-control">
					</div>
				</div>
			</div>
		</div>
		<div class="pagina" data-index="2" id="paginaOperacional"></div>
		<div class="pagina" data-index="3" id="paginaFornecedor"></div>
	</main>
	<footer>
		<div class="navegacao-formulario">
			<button id="btn-voltar">
				<i class="fluigicon fluigicon-pointer-left icon-md" aria-hidden="true"></i>
			</button>
	
			<div class="bolinhas" style="overflow-x: scroll">
				<div class="pagination pagination-active" data-index="0">Identificação</div>
				<div class="pagination" data-index="1">Detalhes</div>
				<div class="pagination" data-index="2">Operacional</div>
				<div class="pagination" data-index="3">Fornecedor & Anexo</div>
			</div>
	
			<button id="btn-avancar">
				<i class="fluigicon fluigicon-pointer-right icon-md" aria-hidden="true"></i>
			</button>
		</div>
	</footer>

</form>
</div>
</body>
</html>
